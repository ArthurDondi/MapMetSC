name: Build Apptainer image

# Manual trigger only: building the image pulls the rocker base and compiles the
# full CRAN + Bioconductor stack, which takes a while and produces a multi-GB
# .sif. Run it from the Actions tab ("Run workflow") when you want a fresh image.
on:
  workflow_dispatch:
    inputs:
      push_ghcr:
        description: "Also push the .sif to GHCR (oras://ghcr.io/<owner>/mapmetsc)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install Apptainer
        run: |
          APPTAINER_VERSION=1.3.6
          cd /tmp
          wget -q "https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "./apptainer_${APPTAINER_VERSION}_amd64.deb"
          apptainer --version

      - name: Build image
        run: |
          apptainer build mapmetsc.sif apptainer/mapmetsc.def
          ls -lh mapmetsc.sif

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapmetsc-sif
          path: mapmetsc.sif
          retention-days: 14
          if-no-files-found: error

      - name: Push to GHCR (optional)
        if: ${{ inputs.push_ghcr }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          apptainer push mapmetsc.sif "oras://ghcr.io/${OWNER}/mapmetsc:latest"
